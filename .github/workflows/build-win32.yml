name: Build Win32
on:
  workflow_dispatch:
  push:
    branches: [win32-v0.3.5]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Win32
        shell: cmd
        run: msbuild proxy_d3d9\proxy_d3d9.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:OutDir=%GITHUB_WORKSPACE%\out\ /m /warnaserror:false
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d3d9-win32-v0.3.5
          path: |
            out\d3d9.dll
            out\d3d9.pdb
